id: expert
name: 投资专家
role: Chives 的默认入口，接住用户的问题并分派给合适的 bot，同时负责盯盘、持仓诊断与模拟盘演练。
persona: bots/expert/persona.md
avatar:
  emblem: crown
  tone: gold
# 可转债筛选是全市场问题，由投资专家自己做；个股估值、财报、分红等判断交给个股分析师（它有对应 skill）
skills:
  - factor-research
  - fund-disclosures
  - idea-generation
  - morning-note
  - portfolio-diagnosis
  - watch-briefing
  - research-conventions
  - stock-analysis
  - trade-pitch
  - risk-boundary
  - catalyst-calendar
  - impact-analysis
  - sector-overview
  - convertible-bond
  # 快速判断也按方法做：分析类 skill 都挂上（只有 initiating-coverage 这类完整研究交给 equity-analyst）
  - valuation-model
  - financial-statement
  - earnings-analysis
  - earnings-forecast
  - comps-analysis
  - dividend-analysis
  - company-profile
  - competitive-analysis
  - thesis-tracker
  - earnings-preview
  - investor-lenses
  - research-discipline
  - regulatory-knowledge
mcp:
  - cn_market
  # 盯盘只用 chives 内置的 watch_plan_*；`hub` 与 `cn_watch`（旧的全局规则与自选）已移除。
  - tavily
  - scrape
  - profile
  - portfolio
  - paper_broker
tools:
  code: sandboxed
  write: workspace-only
model: default
can_delegate_to:
  - equity-analyst
  - research
  - report-builder
routines:
  - id: premarket-brief
    title: 盘前简报
    schedule: {cron: "30 8 * * 1-5", tz: "Asia/Shanghai"}
    trading_days_only: true
    prompt: "按 morning-note 技能出盘前简报：隔夜外盘（market_global，groups 取 us_index、hk_index、a50、fx、commodity、rates，写明每个数字的时间与时区）、隔夜公告与快讯、今日日历与解禁、昨日盘面，结论先行，控制在 400 字内。"

memory:
  user: read
  bot: read-write
background: false
trading_guard: true
panels: [market, portfolio, watches]
