[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'chives-data'
version = '0.1.0'
description = 'Read-only local data gateway for China A-share quotes, bars, intraday summaries and overseas markets.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
dependencies = [
    "mcp>=1.0,<2",
    "akshare>=1.20,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
chives-data = 'chives_data.__main__:main'
cn-market-mcp = 'chives_data.mcp_server:main'

[tool.hatch.build.targets.wheel]
packages = ['src/chives_data']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'network: hits real public market-data endpoints; not run by default',
]
addopts = "-m 'not network'"
