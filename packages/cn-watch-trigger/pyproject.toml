[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'cn-watch-trigger'
version = '0.1.0'
description = 'Read-only alert-triggered analysis runner for the chives-radar engine.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
authors = [{ name = 'dsh-finance' }]
dependencies = [
    'pyyaml>=6.0',
]

[project.optional-dependencies]
test = [
    'pytest>=8.0',
]

[project.scripts]
cn-watch-trigger = 'cn_watch_trigger.cli:main'

[tool.hatch.build.targets.wheel]
packages = ['src/cn_watch_trigger']

[tool.hatch.build.targets.sdist]
include = ['src/cn_watch_trigger', 'tests', 'README.md', 'trigger.example.yaml', 'pytest.ini']
