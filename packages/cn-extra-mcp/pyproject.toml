[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'cn-extra-mcp'
version = '0.1.0'
description = 'Read-only MCP server for China A-share minute bars, live quotes, deterministic intraday summaries and cninfo announcements.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
dependencies = [
    "mcp>=1.0,<2",
    "akshare>=1.20,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cn-extra-mcp = 'cn_extra_mcp.__main__:main'

[tool.hatch.build.targets.wheel]
packages = ['src/cn_extra_mcp']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
testpaths = ['tests']
markers = [
    'network: hits real public market-data endpoints; not run by default',
]
addopts = "-m 'not network'"
