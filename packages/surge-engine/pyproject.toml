[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surge-engine"
version = "0.1.0"
description = "Deterministic first-board / main-wave rule engine for the A-share daily store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cn-daily-store"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
surge-engine = "surge_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
