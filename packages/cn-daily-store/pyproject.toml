[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-daily-store"
version = "0.1.0"
description = "Local A-share daily bar store: backfill, daily update, limit-up rules and data quality checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cn-daily-store = "cn_daily_store.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
