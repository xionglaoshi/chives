[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hub-mcp'
version = '0.1.0'
description = 'Loopback-only MCP client for chives-hub signals and plans.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hub-mcp = 'hub_mcp.__main__:main'

[tool.hatch.build.targets.wheel]
packages = ['src/hub_mcp']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
testpaths = ['tests']
