[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'cn-market-gateway'
version = '0.1.0'
description = 'Read-only local data gateway for China A-share quotes, bars, intraday summaries and overseas markets.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
dependencies = [
    "mcp>=1.0,<2",
    "akshare>=1.20,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
cn-market-gateway = 'cn_market_gateway.__main__:main'
cn-market-mcp = 'cn_market_gateway.mcp_server:main'

[tool.hatch.build.targets.wheel]
packages = ['src/cn_market_gateway']

[tool.pytest.ini_options]
testpaths = ['tests']
markers = [
    'network: hits real public market-data endpoints; not run by default',
]
addopts = "-m 'not network'"
