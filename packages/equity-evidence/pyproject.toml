[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equity-evidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "requests", "akshare", "mcp", "cn-daily-store", "chives-data"]

[tool.hatch.build.targets.wheel]
