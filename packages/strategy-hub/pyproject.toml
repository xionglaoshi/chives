[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-hub"
version = "0.1.0"
description = "Loopback strategy service and unified stdio MCP for Chives strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cn-daily-store", "surge-engine"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
strategy-hub = "strategy_hub.__main__:main"
strategy-mcp = "strategy_hub.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
