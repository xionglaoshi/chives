# market-watch 配置示例（复制为 config.yaml 后修改；相对路径以本文件所在目录为基准）
api:
  host: 127.0.0.1
  port: 8866
runtime:
  db_path: ../../runtime/market/market.db
  out_dir: ../../runtime/market
calendar:
  source: file
  file: ../../config/trade_calendar.json
# 只读 chives-radar 的自选股清单（R1 的个股快照与 R6 使用；R6 当前已停用）
watchlist_file: ../../config/watch.yaml
# 唯一取数入口：本机行情网关，必须是回环 http(s)
gateway:
  url: http://127.0.0.1:8868
polling:
  index_seconds: 3
  breadth_seconds: 20
  limit_pool_seconds: 40
  member_min_interval_seconds: 0.5
  movers_seconds: 30
  flows_seconds: 30
  daily_spark_seconds: 300
  timeout_seconds: 5
  stale_after_seconds:
    index: 15
    breadth: 90
    limit_pool: 150
    industry: 90
limits:
  max_per_minute:
    gateway: 600
  max_concurrency: 2
  alert_max_per_hour: 10
suppression:
  enabled: true
  open_minutes: 15
  close_minutes: 5
# R1/R2 照常；R3–R6 因网关行业口径没有板块代码/成分/涨停归属而停用，
# 参数保留，便于网关补上稳定行业代码后恢复。
rules:
  R1:
    enabled: true
    level: L2
    confirm: 2
    cooldown_minutes: 60
    params:
      change_pct_max: -1.0
      volume_ratio_min: 1.5
  R2:
    enabled: true
    level: L2
    confirm: 3
    cooldown_minutes: 60
    params:
      up_ratio_max: 0.30
      index_change_pct_min: -0.3
      drop_window_minutes: 30
      up_ratio_drop_min: 0.15
  R3:
    enabled: false
  R4:
    enabled: false
  R5:
    enabled: false
  R6:
    enabled: false
