[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'chives-compass'
version = '0.1.0'
description = 'Deterministic A-share index/sector/breadth watch engine (standard library only).'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
authors = [{ name = 'dsh-finance' }]
dependencies = []

[project.optional-dependencies]
test = ['pytest>=8.0']

[project.scripts]
chives-compass = 'chives_compass.__main__:main'

[tool.hatch.build.targets.wheel]
packages = ['src/chives_compass']

[tool.hatch.build.targets.sdist]
include = ['src/chives_compass', 'tests', 'README.md', 'config.example.yaml', 'pytest.ini']
