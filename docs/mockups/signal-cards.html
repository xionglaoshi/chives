<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chives 信号卡演示</title>
<style>
:root {
  --bg: #F2F2F7; --panel: #FFFFFF; --raised: #EFEFF4; --sunken: #E8E8ED;
  --text: #1C1C1E; --text2: #5C5C61; --text3: #8A8A8E; --hair: #E3E3E8; --fill: rgba(120,120,128,.12);
  --up: #E5352C; --down: #27A04A; --on: #fff;
  --blue: #0071E3; --gold: #A67C00; --orange: #C93400; --purple: #8944AB; --gray: #8A8A8E;
  --shadow: 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --glass: rgba(255,255,255,.72); --blur: saturate(180%) blur(22px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --ease: cubic-bezier(.25,1,.5,1);
}
:root[data-theme="dark"] {
  --bg: #000; --panel: #1C1C1E; --raised: #2C2C2E; --sunken: #0A0A0B;
  --text: #F5F5F7; --text2: #B4B4BA; --text3: #8E8E93; --hair: #2C2C2E; --fill: rgba(118,118,128,.24);
  --up: #FF453A; --down: #30D158;
  --blue: #0A84FF; --gold: #E8B923; --orange: #FF9F0A; --purple: #BF5AF2; --gray: #8E8E93;
  --shadow: 0 0 0 .5px rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.45);
  --glass: rgba(28,28,30,.72);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 20px 80px; }
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 18px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); }
.bar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.bar .sub { color: var(--text3); font-size: 12px; }
.sp { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--text2); font: inherit; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.demo-note { font-size: 11px; color: var(--text3); }
h2 { margin: 22px 2px 10px; font-size: 15px; font-weight: 600; letter-spacing: -.012em; display: flex; align-items: center; gap: 8px; }
h2 .n { font-weight: 500; color: var(--text3); font-size: 12px; }
.hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.rail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 980px) { .hero, .rail { grid-template-columns: 1fr; } }
.card { --c: var(--gray); position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; transition: transform 260ms var(--ease), box-shadow 260ms var(--ease), opacity 260ms var(--ease); animation: in 420ms var(--ease) both; }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 0% 0%, color-mix(in oklab, var(--c) 14%, transparent), transparent 60%); }
.card.hero-card { padding: 18px 18px 16px; box-shadow: var(--shadow), 0 0 0 1px color-mix(in oklab, var(--c) 28%, transparent); }
.card:hover { transform: translateY(-2px); }
.card.gone { opacity: 0; transform: scale(.96); }
.t-plan { --c: var(--gold); } .t-opp { --c: var(--blue); } .t-risk { --c: var(--orange); } .t-sector { --c: var(--purple); } .t-info { --c: var(--gray); }
.top { position: relative; display: flex; align-items: center; gap: 8px; }
.ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; color: var(--c); background: color-mix(in oklab, var(--c) 16%, transparent); }
.type { font-size: 12px; font-weight: 600; color: var(--c); }
.time { margin-left: auto; font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
.new { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 0 var(--c); animation: pulse 2.2s ease-out infinite; }
.title { position: relative; font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.hero-card .title { font-size: 19px; }
.concl { position: relative; font-size: 13.5px; line-height: 1.5; color: var(--text); }
.concl b { font-weight: 600; }
.chips { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dir { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 600; color: var(--on); }
.dir.bull { background: var(--up); } .dir.bear { background: var(--down); } .dir.flat { background: var(--fill); color: var(--text2); }
.tag { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--fill); color: var(--text2); }
.brief { position: relative; font-size: 12.5px; color: var(--text2); line-height: 1.55; }
.ctx { position: relative; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
.ctx .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.range { position: relative; height: 6px; border-radius: 3px; background: var(--sunken); margin: 14px 4px 20px; }
.range .zone { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: color-mix(in oklab, var(--gold) 55%, transparent); }
.range .mk { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 1px; background: var(--orange); }
.range .mk span, .range .px span { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; color: var(--text3); font-variant-numeric: tabular-nums; }
.range .px { position: absolute; top: -5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--panel); border: 3px solid var(--text); box-shadow: 0 0 0 4px color-mix(in oklab, var(--text) 12%, transparent); transition: left 600ms var(--ease); }
.range .px span { top: -22px; color: var(--text); font-weight: 700; font-size: 11px; }
.rankrow { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text2); }
.rankrow .big { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rankrow .arrow { color: var(--purple); font-weight: 700; }
svg.spark { display: block; width: 100%; height: 36px; }
.src { position: relative; font-size: 11px; color: var(--text3); }
.acts { position: relative; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.btn { appearance: none; border: 0; font: inherit; font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 999px; cursor: pointer; background: var(--fill); color: var(--text); transition: background 160ms var(--ease), transform 160ms var(--ease); }
.btn:hover { background: var(--sunken); }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--c); color: var(--on); }
.btn.pri:hover { filter: brightness(1.08); background: var(--c); }
.snooze { position: relative; }
.menu { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; min-width: 150px; padding: 6px; border-radius: 14px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); display: none; }
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; appearance: none; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover { background: var(--fill); }
.folded { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); font-size: 13px; color: var(--text2); cursor: pointer; }
.folded b { color: var(--text); }
.folded .tag { margin-left: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 94vw); z-index: 30; padding: 22px 22px 28px; overflow: auto; border-radius: 22px 0 0 22px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); transform: translateX(105%); transition: transform 380ms var(--ease); }
.drawer.open { transform: none; }
.drawer h3 { margin: 4px 0 6px; font-size: 20px; letter-spacing: -.02em; }
.drawer p { font-size: 13.5px; line-height: 1.65; color: var(--text2); }
.drawer .x { position: absolute; top: 16px; right: 16px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; z-index: 40; padding: 10px 16px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow); font-size: 13px; transition: all 320ms var(--ease); display: flex; gap: 12px; align-items: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast button { appearance: none; border: 0; background: transparent; color: var(--blue); font: inherit; font-weight: 600; cursor: pointer; }
@keyframes in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>盯盘 · 信号</h1><span class="sub">示例数据，仅演示信号卡的样式与交互</span>
    <span class="sp"></span>
    <div class="seg" id="filter"><button class="on" data-f="all">全部</button><button data-f="decide">待决策</button><button data-f="stock">我的票</button><button data-f="sector">板块</button></div>
    <div class="seg" id="theme"><button class="on" data-t="light">浅色</button><button data-t="dark">深色</button></div>
  </div>

  <h2>待你决策 <span class="n" id="decideCount">3</span></h2>
  <div class="hero" id="hero"></div>

  <h2>信号 <span class="n" id="railCount">4</span></h2>
  <div class="rail" id="rail"></div>

  <h2>已处理</h2>
  <div class="folded" id="folded"><span>今天已处理 <b id="doneCount">12</b> 条</span><span class="tag">已合并 19 条「太平洋 · 放量」同类误报</span></div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="btn x" id="closeDrawer">关闭 Esc</button>
  <div id="drawerBody"></div>
</aside>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo">撤销</button></div>

<script>
const CARDS = [
 { id: 'p1', hero: true, kind: 'plan', icon: '◎', type: '计划触发 · 进场', time: '10:12', stock: true, decide: true, fresh: true,
   title: '南方精工 回到了你设的进场位', dir: 'bull', dirText: '偏多',
   concl: '现价 <b>15.83</b> 进入昨天分析给的进场区间 <b>15.60 – 15.85</b>，缩量回踩，符合当时的前提。',
   brief: '当时的条件：回踩 5 日线、量能低于前日的 70%。目前成交额为昨日同时点的 64%，条件仍成立；上方压力 16.00。',
   ctx: { type: 'range', lo: 15.60, hi: 15.85, stop: 14.50, px: 15.83, min: 14.2, max: 16.3 },
   src: '来自 11-03 14:12 的分析 · 计划 P-0312（有效至 11-07）', primary: '查看分析' },
 { id: 'p2', hero: true, kind: 'plan', icon: '⌁', type: '计划触发 · 不再跟', time: '09:48', stock: true, decide: true,
   title: '太平洋 跌破了你放弃的位置', dir: 'bear', dirText: '偏空',
   concl: '昨天的分析说「跌破 <b>3.50</b> 且放量就不再跟」，现价 <b>3.47</b>，放量 2.1 倍，条件已触发。',
   brief: '同时板块（证券）走弱，个股弱于板块；没有新增公告。建议把它从重点盯盘里移出，或改为只看不提醒。',
   ctx: { type: 'range', lo: 3.50, hi: 3.50, stop: 3.40, px: 3.47, min: 3.35, max: 3.70, giveup: true },
   src: '来自 11-03 15:20 的分析 · 计划 P-0313', primary: '移出盯盘' },
 { id: 'p3', hero: true, kind: 'sector', icon: '▦', type: '板块异动 · 潜在机会', time: '10:02', sector: true, decide: true,
   title: '半导体设备 排名 25 → 3，放量上冲', dir: 'bull', dirText: '偏多',
   concl: '30 分钟内涨幅排名从第 25 升到第 3，成交额占比 4.1%（20 日中位数 1.6%），上涨 17/21 家。',
   brief: '属于你没有关注的板块；领涨股 拓荆科技、中微公司。仅为盘中信号，需要确认是否有消息催化。',
   ctx: { type: 'rank', from: 25, to: 3, share: '4.1%', spark: [3,3.2,3.1,3.6,4.2,4.9,5.6,6.8] },
   src: '板块规则 R3 · 引擎实时计算', primary: '让 Chives 研究' },
 { id: 'r1', kind: 'risk', icon: '△', type: '风险 · 市场', time: '09:41', sector: true,
   title: '市场宽度恶化：上涨占比 0.31', dir: 'bear', dirText: '偏空',
   concl: '指数小跌但个股普跌，涨跌家数 1620 : 3510，涨停 25 家，炸板 12 家。', brief: '资金在少数权重股上，赚钱效应偏弱。', src: '市场规则 R2', primary: '查看分析' },
 { id: 'o1', kind: 'opp', icon: '✦', type: '机会 · 候选', time: '09:35', stock: true,
   title: '你关注的 电子 板块出现分歧', dir: 'flat', dirText: '中性',
   concl: '电子内部涨跌分化明显（上涨 38%），龙头在跌、小票在涨，等收盘后再看。', brief: '来自昨天的「观察电子板块持续性」计划。', src: '计划 P-0309', primary: '让 Chives 重看' },
 { id: 'i1', kind: 'info', icon: '•', type: '信息 · 已归并', time: '09:30', stock: true,
   title: '太平洋 开盘放量提示（误报）', dir: 'flat', dirText: '中性',
   concl: '开盘第一分钟前一窗口成交额为 0，属于开盘误报，不含方向信息。', brief: '已合并 19 条同类；规则已修复，之后不会再出现。', src: '告警分析 #28', primary: '知道了' },
];
const kindClass = { plan: 't-plan', opp: 't-opp', risk: 't-risk', sector: 't-sector', info: 't-info' };
const FULL = {
  p1: '<h3>南方精工 回到了你设的进场位</h3><p><b>结论：</b>现价 15.83 进入进场区间 15.60–15.85，缩量回踩，条件成立，偏多。</p><p><b>依据：</b>① 回踩 5 日线（15.71）未破；② 成交额为昨日同时点的 64%，低于计划里的 70% 上限；③ 板块（机械设备）今日 -0.4%，个股相对抗跌。</p><p><b>风险：</b>上方 16.00 有压力；跌破 15.50 且放量则计划失效。止损参考 14.50。</p><p><b>数据时间：</b>10:12:08，来源 腾讯快照、cn_intraday_summary。（示例内容）</p>',
  p2: '<h3>太平洋 跌破了你放弃的位置</h3><p><b>结论：</b>放弃条件已触发，建议移出重点盯盘。</p><p>（示例内容）</p>',
  p3: '<h3>半导体设备 排名 25 → 3</h3><p><b>结论：</b>盘中强势信号，尚无消息确认。（示例内容）</p>',
};
const $ = (s) => document.querySelector(s);
function ctxHtml(c) {
  if (!c) return '';
  if (c.type === 'range') {
    const pos = (v) => ((v - c.min) / (c.max - c.min) * 100).toFixed(1);
    const zone = c.lo === c.hi ? '' : `<div class="zone" style="left:${pos(c.lo)}%;width:${(pos(c.hi) - pos(c.lo)).toFixed(1)}%"></div>`;
    const mk = c.giveup ? `<div class="mk" style="left:${pos(c.lo)}%;background:var(--orange)"><span>放弃位 ${c.lo.toFixed(2)}</span></div>` : `<div class="mk" style="left:${pos(c.stop)}%"><span>止损 ${c.stop.toFixed(2)}</span></div>`;
    return `<div class="ctx"><div class="lab"><span>${c.giveup ? '现价 vs 放弃位' : '现价 vs 进场区间'}</span><span>${c.giveup ? '' : c.lo.toFixed(2) + ' – ' + c.hi.toFixed(2)}</span></div><div class="range">${zone}${mk}<div class="px" style="left:${pos(c.px)}%"><span>${c.px.toFixed(2)}</span></div></div></div>`;
  }
  const pts = c.spark, mx = Math.max(...pts), mn = Math.min(...pts);
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 100).toFixed(1)} ${(32 - (v - mn) / (mx - mn || 1) * 28).toFixed(1)}`).join(' ');
  return `<div class="ctx"><div class="rankrow"><span>排名</span><span class="big">${c.from} <span class="arrow">→</span> ${c.to}</span><span style="margin-left:auto">成交额占比 ${c.share}</span></div><svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--purple)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg></div>`;
}
function cardHtml(c) {
  const dir = `<span class="dir ${c.dir === 'bull' ? 'bull' : c.dir === 'bear' ? 'bear' : 'flat'}">${c.dir === 'bull' ? '▲' : c.dir === 'bear' ? '▼' : '—'} ${c.dirText}</span>`;
  return `<article class="card ${kindClass[c.kind]} ${c.hero ? 'hero-card' : ''}" data-id="${c.id}">
    <div class="top"><span class="ico">${c.icon}</span><span class="type">${c.type}</span>${c.fresh ? '<span class="new" title="新"></span>' : ''}<span class="time">${c.time}</span></div>
    <div class="title">${c.title}</div>
    <div class="chips">${dir}${c.stock ? '<span class="tag">我的票</span>' : ''}${c.sector ? '<span class="tag">板块</span>' : ''}</div>
    <div class="concl">${c.concl}</div>
    <div class="brief">${c.brief}</div>
    ${ctxHtml(c.ctx)}
    <div class="src">${c.src}</div>
    <div class="acts">
      <button class="btn pri" data-a="open">${c.primary}</button>
      <button class="btn" data-a="recheck">让 Chives 重看</button>
      <span class="snooze"><button class="btn" data-a="snooze">稍后提醒 ▾</button><div class="menu"><button data-s="30 分钟后">30 分钟后</button><button data-s="收盘前 14:30">收盘前 14:30</button><button data-s="明天开盘 09:30">明天开盘 09:30</button></div></span>
      <button class="btn" data-a="ignore">忽略</button>
    </div></article>`;
}
let state = { filter: 'all', done: 12, lastRemoved: null };
function render() {
  const keep = (c) => state.filter === 'all' || (state.filter === 'decide' && c.decide) || (state.filter === 'stock' && c.stock) || (state.filter === 'sector' && c.sector);
  const gone = state.gone || new Set();
  const list = CARDS.filter((c) => keep(c) && !gone.has(c.id));
  $('#hero').innerHTML = list.filter((c) => c.hero).map(cardHtml).join('') || '<div class="folded">没有需要你决策的信号</div>';
  $('#rail').innerHTML = list.filter((c) => !c.hero).map(cardHtml).join('') || '<div class="folded">这个筛选下没有信号</div>';
  $('#decideCount').textContent = list.filter((c) => c.hero).length;
  $('#railCount').textContent = list.filter((c) => !c.hero).length;
  $('#doneCount').textContent = state.done;
}
function toast(text, undo) { $('#toastText').textContent = text; $('#undo').style.display = undo ? '' : 'none'; $('#toast').classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').classList.remove('show'), 4200); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const card = b.closest('.card'); const id = card && card.dataset.id;
  if (b.dataset.f) { state.filter = b.dataset.f; document.querySelectorAll('#filter button').forEach((x) => x.classList.toggle('on', x === b)); render(); return; }
  if (b.dataset.t) { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); return; }
  if (b.dataset.a === 'snooze') { document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open')); b.nextElementSibling.classList.toggle('open'); e.stopPropagation(); return; }
  document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open'));
  if (b.dataset.s) { dismiss(id, `已设置提醒：${b.dataset.s}`); return; }
  if (b.dataset.a === 'ignore') { dismiss(id, '已忽略，已记入「已处理」'); return; }
  if (b.dataset.a === 'recheck') { toast('已让 Chives 重新分析（示例：这里会打开一个新会话）', false); return; }
  if (b.dataset.a === 'open') { const c = CARDS.find((x) => x.id === id); $('#drawerBody').innerHTML = FULL[id] || `<h3>${c.title}</h3><p>${c.concl}</p><p>${c.brief}</p><p>（示例内容：这里会显示完整的分析，包含依据、风险、数据时间与来源。）</p>`; $('#drawer').classList.add('open'); return; }
  if (b.id === 'closeDrawer') $('#drawer').classList.remove('open');
  if (b.id === 'undo' && state.lastRemoved) { state.gone.delete(state.lastRemoved); state.done -= 1; state.lastRemoved = null; $('#toast').classList.remove('show'); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });
function dismiss(id, text) { const el = document.querySelector(`.card[data-id="${id}"]`); if (el) el.classList.add('gone'); setTimeout(() => { state.gone = state.gone || new Set(); state.gone.add(id); state.done += 1; state.lastRemoved = id; render(); toast(text, true); }, 240); }
if (matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.dataset.theme = 'dark'; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x.dataset.t === 'dark')); }
render();
</script>
