<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Chives Logo：点金</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; background: #0C0B0A; color: #EDE8DF; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: baseline; gap: 16px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">Logo：点金</h1>
<span style="color: #B5AEA2">已选定“金从下起”：一块石头，金色从底部漫上来，石与金的分界线是字母 M。</span>
</div>

<div style="display: flex; gap: 20px; flex: 1; min-height: 0">

<section style="flex: 1.5; border: 1px solid #C8A96A; border-radius: 18px; background: #141210; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: center; flex: 1">
<svg width="300" height="300" viewBox="0 0 64 64" role="img" aria-label="定稿：六边形石头，上半是石、下半是金，分界线是 M 形"><path d="M32 8L11 20v24l21 12 21-12V20z" fill="#C8A96A"></path><path d="M32 8L11 20v22l10-17 11 14 11-14 10 17V20z" fill="#4A453E"></path><path d="M32 8L11 20l10 5 11-6 11 6 10-5z" fill="#FFFFFF" fill-opacity="0.06"></path><path d="M11 42l10-17 11 14 11-14 10 17" fill="none" stroke="#141210" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</div>
<div><div style="font-size: 18px; font-weight: 600">金从下起 <span style="font-size: 12px; color: #C8A96A; font-weight: 400">定稿 · 已用到全部页面</span></div><div style="color: #B5AEA2">石头和金子的分界线本身就是 M。金色从底部漫上来，像石头正在一点点变成金子。图形最简，缩到 16 像素仍然清楚。</div></div>
<div style="display: flex; align-items: center; gap: 22px; padding-top: 16px; border-top: 1px solid #2A2622">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#1E1B18"></rect><path d="M32 10L13 21v22l19 11 19-11V21z" fill="#C8A96A"></path><path d="M32 10L13 21v20l9-15.5 10 13 10-13 9 15.5V21z" fill="#5A544B"></path></svg>
<svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8L11 20v24l21 12 21-12V20z" fill="#C8A96A"></path><path d="M32 8L11 20v22l10-17 11 14 11-14 10 17V20z" fill="#5A544B"></path></svg>
<svg width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8L11 20v24l21 12 21-12V20z" fill="#C8A96A"></path><path d="M32 8L11 20v22l10-17 11 14 11-14 10 17V20z" fill="#5A544B"></path></svg>
<span style="display: flex; align-items: center; gap: 10px; margin-left: 12px">
<svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8L11 20v24l21 12 21-12V20z" fill="#C8A96A"></path><path d="M32 8L11 20v22l10-17 11 14 11-14 10 17V20z" fill="#5A544B"></path></svg>
<span style="font-size: 24px; font-weight: 600; letter-spacing: 0.04em">Chives</span>
</span>
<span style="margin-left: auto; font-size: 12px; color: #948D82">应用图标 · 32 像素 · 18 像素 · 字标</span>
</div>
</section>

<section style="flex: 1; border: 1px solid #2A2622; border-radius: 18px; background: #141210; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: center; flex: 1">
<svg width="190" height="190" viewBox="0 0 64 64" role="img" aria-label="未采用：半石半金，石面有一道 M 形裂缝"><path d="M32 8L11 20v24l21 12z" fill="#4A453E"></path><path d="M32 8l21 12v24L32 56z" fill="#C8A96A"></path><path d="M19 43l3-10 1.5-9 4.5 6 4 7.5 3.5-6.5 5-7 2 9 2.5 10" fill="none" stroke="#141210" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><path d="M23.5 24l-1.6-5.4M40.5 24l1.6-5.4" fill="none" stroke="#141210" stroke-width="1.2" stroke-linecap="round"></path></svg>
</div>
<div><div style="font-size: 16px; font-weight: 600">未采用 · 半石半金</div><div style="color: #B5AEA2">左石右金，M 形裂缝横穿两侧。裂缝感最强，但小尺寸下细纹糊在一起。</div></div>
</section>

<section style="flex: 1; border: 1px solid #2A2622; border-radius: 18px; background: #141210; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: center; flex: 1">
<svg width="190" height="190" viewBox="0 0 64 64" role="img" aria-label="未采用：整块石头，M 形裂缝里透出金色"><path d="M32 8L11 20v24l21 12 21-12V20z" fill="#3F3A34"></path><path d="M19 43l3-10 1.5-9 4.5 6 4 7.5 3.5-6.5 5-7 2 9 2.5 10" fill="none" stroke="#C8A96A" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"></path><path d="M23.5 24l-1.6-5.4M40.5 24l1.6-5.4" fill="none" stroke="#C8A96A" stroke-width="1.3" stroke-linecap="round"></path></svg>
</div>
<div><div style="font-size: 16px; font-weight: 600">未采用 · 石中见金</div><div style="color: #B5AEA2">整块是石头，金色只从裂缝里透出。更含蓄，但金色面积少，不够醒目。</div></div>
</section>

</div>
</div>
