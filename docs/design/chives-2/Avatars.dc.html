<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Chives 可选头像与命名</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 44px 56px; background: #0C0B0A; color: #EDE8DF; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: baseline; gap: 16px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">可选头像与命名</h1>
<span style="color: #A8A196">能力仍由 Chives 预置；头像和称呼是你可以自己定的两样东西。本页用乌金色调示意。</span>
</div>

<div style="display: flex; gap: 24px; flex: 1; min-height: 0">

<section aria-label="入口 Bot 的命名" style="flex: 0 0 370px; border: 1px solid #2A2622; border-radius: 18px; background: #141210; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">入口 Bot 的名字</h2>
<sc-for list="{{names}}" as="n" hint-placeholder-count="5">
<div style="padding: 12px 14px; border-radius: 12px; border: 1px solid {{n.border}}; background: {{n.bg}}; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 17px; font-weight: 600">{{n.name}}</span><span style="font-size: 12px; color: #C8A96A">{{n.tag}}</span></div>
<div style="font-size: 13px; color: #A8A196">{{n.why}}</div>
</div>
</sc-for>
<div style="margin-top: auto; font-size: 13px; color: #A8A196">其余四个保持职能名：分析师、研究员、数据员、报告员。五个名字放在一起像一个投研团队。</div>
</section>

<section aria-label="头像选择器" style="flex: 1; min-width: 0; border: 1px solid #2A2622; border-radius: 18px; background: #141210; padding: 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="flex: none; width: 72px; height: 72px; border-radius: 50%; background: #C8A96A; color: #0C0B0A; display: flex; align-items: center; justify-content: center">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h16M5 17l-1-9 5 4 3-6 3 6 5-4-1 9"></path></svg>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="nick" style="font-size: 12px; color: #A8A196">称呼</label>
<input id="nick" type="text" value="投资专家" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A352F; background: #0C0B0A; color: #EDE8DF; font: inherit; font-size: 16px">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; color: #A8A196">选一个头像</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{avatars}}" as="a" hint-placeholder-count="12">
<button type="button" aria-label="{{a.label}}" aria-pressed="{{a.pressed}}" style="aspect-ratio: 1 / 1; border-radius: 16px; border: 2px solid {{a.ring}}; background: #1E1B18; color: {{a.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg>
<span style="font-size: 12px; color: #A8A196">{{a.label}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; color: #A8A196">底色</div>
<div style="display: flex; gap: 14px">
<sc-for list="{{tones}}" as="t" hint-placeholder-count="5">
<button type="button" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: 0; padding: 0; color: #A8A196; min-width: 52px">
<span style="width: 44px; height: 44px; border-radius: 50%; background: {{t.hex}}; outline: 2px solid {{t.ring}}; outline-offset: 3px"></span>
<span style="font-size: 12px">{{t.label}}</span>
</button>
</sc-for>
</div>
</div>

<div style="margin-top: auto; display: flex; gap: 10px; border-top: 1px solid #2A2622; padding-top: 16px">
<button type="button" style="min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #C8A96A; color: #0C0B0A; font-weight: 600">保存</button>
<button type="button" style="min-height: 44px; padding: 0 22px; border-radius: 10px; border: 1px solid #3A352F; background: transparent; color: #EDE8DF">恢复默认</button>
<span style="margin-left: auto; display: flex; align-items: center; font-size: 12px; color: #A8A196">入口在 Bot 资料页的头像上；以后可以加上传自己的图片。</span>
</div>
</section>

<section aria-label="换头像后的 Bot 列表" style="flex: 0 0 320px; border: 1px solid #2A2622; border-radius: 18px; background: #0F0E0C; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 8px 10px; font-size: 12px; color: #A8A196">换上默认头像后的列表</div>
<sc-for list="{{team}}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 12px; background: {{b.rowBg}}">
<span style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: {{b.bg}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"></path></svg>
</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">{{b.name}}</span><span style="display: block; font-size: 12px; color: #A8A196">{{b.role}}</span></span>
</div>
</sc-for>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var I = {
crown: 'M4 17h16M5 17l-1-9 5 4 3-6 3 6 5-4-1 9',
scale: 'M12 4v16M7 20h10M5 8h14M5 8l-2.5 6h5zM19 8l-2.5 6h5z',
lens: 'M10.5 5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM15 15l5 5',
bars: 'M5 20V10M12 20V5M19 20v-7M3 20h18',
scroll: 'M7 4h10v14a2 2 0 01-2 2H7zM7 4a2 2 0 00-2 2v2h2M10 9h4M10 13h4',
compass: 'M12 3a9 9 0 100 18 9 9 0 000-18zM15.5 8.5l-2 5-5 2 2-5z',
coin: 'M12 4a8 8 0 100 16 8 8 0 000-16zM9 8.5l3 4 3-4M12 12.5V17M9.5 13.5h5',
quill: 'M19 4c-7 1-11 6-12 13l-2 3M9 15c3 0 6-1 8-4',
key: 'M8 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM11.5 12H20M17 12v3',
hourglass: 'M7 4h10M7 20h10M8 4c0 5 8 5 8 16M16 4c0 5-8 5-8 16',
lamp: 'M9 17h6M10 20h4M12 4a6 6 0 00-3.5 10.8V17h7v-2.2A6 6 0 0012 4z',
shield: 'M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z'
};
var av = [['crown','王冠'],['scale','天平'],['lens','放大镜'],['bars','算筹'],['scroll','卷轴'],['compass','罗盘'],['coin','金币'],['quill','羽笔'],['key','钥匙'],['hourglass','沙漏'],['lamp','明灯'],['shield','盾徽']];
var tones = [['金','#C8A96A'],['银','#B9BEC4'],['铜','#B07A52'],['玉','#7FA693'],['墨','#3A352F']];
return {
names: [
{ name: '投资专家', tag: '已选定', why: '入口 Bot。接住你的问题、统筹并分派给其他四位；名字直接说明它懂投资，不需要解释。', border: '#C8A96A', bg: '#1E1B18' },
{ name: '首席', tag: '', why: '备选：首席投资官的简称，上下级关系更清楚，但要多想一步才知道它是做什么的。', border: '#2A2622', bg: 'transparent' },
{ name: '军师', tag: '', why: '备选：出谋划策、统筹全局，语感亲切，略偏口语。', border: '#2A2622', bg: 'transparent' }
],
avatars: av.map(function (x, i) { return { d: I[x[0]], label: x[1], pressed: i === 0 ? 'true' : 'false', ring: i === 0 ? '#C8A96A' : '#2A2622', fg: i === 0 ? '#C8A96A' : '#EDE8DF' }; }),
tones: tones.map(function (x, i) { return { label: x[0], hex: x[1], pressed: i === 0 ? 'true' : 'false', ring: i === 0 ? '#C8A96A' : 'transparent' }; }),
team: [
{ name: '投资专家', role: '默认入口 · 统筹与分派', d: I.crown, bg: '#C8A96A', fg: '#0C0B0A', rowBg: '#1E1B18' },
{ name: '分析师', role: '个股深度分析', d: I.scale, bg: '#B9BEC4', fg: '#0C0B0A', rowBg: 'transparent' },
{ name: '研究员', role: '行业与事件研究', d: I.lens, bg: '#7FA693', fg: '#0C0B0A', rowBg: 'transparent' },
{ name: '数据员', role: '后台同事 · 取数与清洗', d: I.bars, bg: '#3A352F', fg: '#EDE8DF', rowBg: 'transparent' },
{ name: '报告员', role: '后台同事 · 成稿', d: I.scroll, bg: '#B07A52', fg: '#0C0B0A', rowBg: 'transparent' }
]
};
}
}
</script>
</body>
</html>
