name: Build GitHub installer
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: '发布前在 runner 中执行完整试装'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x64}
          - {os: windows-2022, target: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.9.0
      - uses: astral-sh/setup-uv@v6
      - name: Prepare publishing environment
        shell: bash
        run: |
          uv python install 3.12
          uv venv --managed-python --python 3.12 --seed .build-env
          if [[ "$RUNNER_OS" == Windows ]]; then py="$PWD/.build-env/Scripts/python.exe"; else py="$PWD/.build-env/bin/python"; fi
          uv pip install --python "$py" pyzipper==0.3.6
          echo "BUILD_PYTHON=$py" >> "$GITHUB_ENV"
      - name: Build release assets
        shell: bash
        env:
          CHIVES_INSTALL_CODE: ${{ secrets.CHIVES_INSTALL_CODE }}
        run: '"$BUILD_PYTHON" deploy/installer/build_release.py dist-installer'
      - name: Install from the staged release and check all services
        if: inputs.smoke_test && contains(fromJSON('["linux-x64","windows-x64","macos-arm64"]'), matrix.target)
        shell: bash
        env:
          CHIVES_INSTALL_CODE: ${{ secrets.CHIVES_INSTALL_CODE }}
        run: '"$BUILD_PYTHON" deploy/installer/check_release.py dist-installer ${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist-installer/*
          compression-level: 0
          retention-days: 2
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat deploy/installer/channel)
          [[ "$tag" =~ ^installer-[0-9]+(\.[0-9]+)+$ ]]
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "Chives · $tag" --notes '按 README 的命令安装，向导会自动选择平台并校验下载。' assets/*
