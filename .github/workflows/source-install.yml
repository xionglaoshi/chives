name: Chives source install
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-install.yml'
      - 'deploy/installer/install.py'
      - 'deploy/installer/source.py'
      - 'deploy/installer/check_source_install.py'
      - 'deploy/installer/check_initialization_browser.py'
      - 'scripts/install-chives.sh'
      - 'scripts/install-browser.sh'
      - 'apps/server/src/settings/channels.ts'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: macos-15, target: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and boot isolated Chives
        run: python deploy/installer/check_source_install.py ${{ matrix.target }}
