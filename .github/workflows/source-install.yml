name: Chives source install
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-install.yml'
      - 'deploy/installer/install.py'
      - 'deploy/installer/source.py'
      - 'deploy/installer/check_source_install.py'
permissions:
  contents: read
jobs:
  source-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and boot isolated Chives
        run: python deploy/installer/check_source_install.py linux-x64
